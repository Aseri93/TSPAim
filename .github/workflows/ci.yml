name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium
      
      - name: Build
        run: npm run build
      
      - name: Unit Tests
        run: npm run test
      
      - name: E2E Tests
        run: npm run test:e2e -- --project="Desktop 1080p"
